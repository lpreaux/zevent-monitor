name: zevent-monitor

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zevent}
      POSTGRES_USER: ${POSTGRES_USER:-zevent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
      COLLECT_INTERVAL_MS: ${COLLECT_INTERVAL_MS:-15000}
      GOALS_SYNC_ENABLED: ${GOALS_SYNC_ENABLED:-true}
      GOALS_SYNC_INTERVAL_MS: ${GOALS_SYNC_INTERVAL_MS:-300000}
      PLANNING_SYNC_ENABLED: ${PLANNING_SYNC_ENABLED:-true}
      PLANNING_SYNC_INTERVAL_MS: ${PLANNING_SYNC_INTERVAL_MS:-600000}
      DONATIONS_ENABLED: ${DONATIONS_ENABLED:-true}
      DONATIONS_INTERVAL_MS: ${DONATIONS_INTERVAL_MS:-20000}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      GOAL_NEAR_RATIO: ${GOAL_NEAR_RATIO:-0.9}
      PUSH_RECEIPTS_INTERVAL_MS: ${PUSH_RECEIPTS_INTERVAL_MS:-300000}
      DATABASE_URL: postgres://${POSTGRES_USER:-zevent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zevent}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
