name: zevent-monitor

# Fusionné automatiquement par `docker compose up` en local (aucun `-f` fourni).
# Dockploy est configuré pour utiliser explicitement docker-compose.yml (cf. README),
# donc ce fichier n'est jamais pris en compte en production : pas de port publié,
# le service `server` reste joignable uniquement via le domaine HTTPS choisi.
services:
  server:
    ports:
      - "${SERVER_PORT:-3000}:3000"
